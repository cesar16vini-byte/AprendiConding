<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="cat.png" type="image/x-icon">
  <title>AprendiCoding - Matrícula Grátis</title>
  <link rel="stylesheet" href="style_matricula.css">
</head>
<body>

  <span class="bubble b1"></span>
  <span class="bubble b2"></span>
  <span class="bubble b3"></span>
  <span class="bubble b4"></span>
  <span class="bubble b5"></span>

  <section class="card">
    <header class="logo">
      <a href="../Inicial/pagina_inicial.html" style="display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit;">
        <svg class="logo-icon" viewBox="0 0 40 34" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="30" height="20" rx="2" fill="none" stroke="var(--azul)" stroke-width="2"/>
          <path d="M0 25 h34 l-3 4 h-28 z" fill="var(--azul)"/>
          <path d="M10 8 L6 12 L10 16" stroke="var(--azul)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M23 8 L27 12 L23 16" stroke="var(--azul)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="19" y1="7" x2="15" y2="17" stroke="var(--azul)" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M35 4 l1.2 2.6 2.8 0.4 -2 2 0.5 2.8 -2.5 -1.3 -2.5 1.3 0.5 -2.8 -2 -2 2.8 -0.4 z" fill="var(--amarelo)"/>
        </svg>
        <hgroup>
          <p class="logo-text">APRENDI<span class="highlight">CODING</span></p>
          <p class="logo-sub">APRENDER · CODAR · EVOLUIR</p>
        </hgroup>
      </a>
    </header>

    <h1>Matrícula Grátis</h1>

    <form>
      <label for="mat-nome">Nome *</label>
      <input type="text" id="mat-nome" placeholder="Insira o nome que usará no certificado" required>

      <label for="mat-sobrenome">Sobrenome *</label>
      <input type="text" id="mat-sobrenome" placeholder="Insira o sobrenome que usará no certificado" required>

      <label for="mat-email">E-mail *</label>
      <input type="email" id="mat-email" placeholder="E-mail" required>

      <label for="mat-confirma-email">Confirme seu e-mail *</label>
      <input type="email" id="mat-confirma-email" placeholder="Confirme seu e-mail" required>

      <label for="mat-senha">Senha *</label>
      <input type="password" id="mat-senha" placeholder="Insira sua senha" required>

      <label for="mat-confirma-senha">Confirmar senha *</label>
      <input type="password" id="mat-confirma-senha" placeholder="Confirme a senha" required>

      <button type="submit" class="btn btn--solid btn--wide">Registrar Gratuitamente</button>
    </form>

    <p class="card__note">
      Todos os cursos disponíveis a plataforma do AprendiCoding são gratuitos, porém
      a EMISSÃO DE CERTIFICADOS é um serviço pago, dependendo do pacote contratado.
    </p>

    <p class="card__note">
      Já tem uma conta? <a href="../login/pagina_login.html">Entrar</a>
    </p>
  </section>

</body>
</html>
